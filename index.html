<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Birthday Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>❤</span><span>❤</span><span>❤</span><span>❤</span>
    <span>❤</span><span>❤</span><span>❤</span><span>❤</span>
  </div>

  <main class="container">
    <h1 class="title">💖 A Special Letter 💖</h1>

    <div class="envelope" id="envelope">
      <div class="letter" id="letter">
        <h2>My Dear ❤️</h2>
        <p>Happy Birthday to the most amazing female friend anyone could ever ask for.</p>
        <p>Thank you for bringing happiness into my life.</p>
        <p>You are my best friend, my crime partner, and my gossip partner.</p>
        <h3>❤️ Love Always ❤️</h3>
      </div>
      <div class="top-flap"></div>
      <div class="front-pocket"></div>
    </div>

    <div class="buttons">
      <button id="openBtn" type="button">Open Letter 💌</button>
      <button id="closeBtn" type="button" disabled>Close Letter 📩</button>
    </div>
  </main>
</body>
</html>
